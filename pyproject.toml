[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffbench"
version = "0.1.0"
description = "A/B performance testing and payload regression CLI for backend developers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Bryan Dong" }]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "typing-extensions>=4.0",
]

[project.scripts]
diffbench = "diffbench.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diffbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
